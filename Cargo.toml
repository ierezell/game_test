[workspace]
members = [
    "crates/client",
    "crates/shared",
    "crates/launcher",
    "crates/server",
    # "crates/llm",
    # "crates/reinforcement_learning",
]
resolver = "3"

[profile.test]
incremental = true
opt-level = 0
lto = false
debug = 0
debug-assertions = true
overflow-checks = true


[profile.dev]
incremental = true
opt-level = 0
lto = false
debug = 0
debug-assertions = true
overflow-checks = true


[workspace.dependencies]
rand = "0.10.2"
clap = { version = "4.6.6", features = ["derive"] }
avian3d = { version = "0.7", default-features = true, features = [
    "serialize",
    "bevy_diagnostic",
] }
bevy = { version = "0.19", default-features = true, features = [
    "bevy_dev_tools",
] }
bevy-inspector-egui = { version = "0.37", default-features = true, features = [
    "bevy_pbr",
    "bevy_image",
    "bevy_render",
    "egui_open_url",
] }
bevy_enhanced_input = { version = "0.26", default-features = true, features = [
    "serialize",
] }
serde = { version = "1.0.229", default-features = true, features = ["derive"] }
lightyear = { version = "0.29", default-features = true, features = [
    "netcode",
    "input_bei",
    "avian3d",
    "udp",
    "crossbeam",
    "prediction",
    "interpolation",
    "replication",
] }
vleue_navigator = { version = "0.16", default-features = false, features = [
    "avian3d",
] }

[workspace.lints.clippy]
type_complexity = "allow"
default_constructed_unit_structs = "allow"
